[project]
name = "relay"
version = "0.1.0"
description = "A server-side event collector and delivery gateway."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = ["fastapi (>=0.162.0,<0.163.0)", "uvicorn (>=0.54.0,<0.55.0)"]

[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "ruff (>=0.17.3,<0.18.0)",
    "pyright (>=1.1.414,<2.0.0)",
    "pytest (>=9.2.0,<10.0.0)",
    "httpx2 (>=2.16.0,<3.0.0)"
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pyright]
include = ["app", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
